<!doctype html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Create Quiz · Find Your Real Friend</title>
<link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="assets/ui-kit/objects/objects.css"><link rel="stylesheet" href="css/style.css">
</head><body>
<div class="cute-world" aria-hidden="true"><div class="world-blob blob-a"></div><div class="world-blob blob-b"></div><div class="world-blob blob-c"></div><div class="world-blob blob-d"></div><div class="cloud cloud-1"></div><div class="cloud cloud-2"></div><div class="cloud cloud-3"></div><div class="sparkle s-1"></div><div class="sparkle s-2"></div><div class="sparkle s-3"></div><div class="sparkle s-4"></div><div class="bubble b-1"></div><div class="bubble b-2"></div><div class="bubble b-3"></div></div>
<header class="site-header" id="siteHeader"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span><span class="brand-name">Find Your Real Friend</span><br><span class="brand-sub">Friendship Quiz World</span></span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="scoreboard.html">My Dashboard</a><button class="mobile-menu-button" id="mobileMenuButton" type="button" aria-expanded="false"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header>
<main class="form-page"><div class="section-title"><h2>Create Your Friendship Quiz 💖</h2><p>Choose Male or Female, pick 10–15 questions, then select your correct answers.</p></div><section class="cute-card form-card"><form id="createQuizForm"><div class="form-grid"><div class="field"><label for="creatorName">Your Name</label><input id="creatorName" required maxlength="50" placeholder="Enter your name"></div><div class="field gender-field"><label>Your Gender</label><input id="creatorGender" type="hidden" required><div class="gender-picker" role="radiogroup" aria-label="Your Gender"><button type="button" class="gender-card gender-male" data-gender="Male" role="radio" aria-checked="false"><span class="gender-art">♂</span><span class="gender-name">Male</span><span class="gender-hint">Male question bank</span></button><button type="button" class="gender-card gender-female" data-gender="Female" role="radio" aria-checked="false"><span class="gender-art">♀</span><span class="gender-name">Female</span><span class="gender-hint">Female question bank</span></button></div></div></div><div id="questionBuilder" class="question-builder"></div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:22px"><button class="button purple" id="addQuestionButton" type="button">+ Add Question</button><button class="button pink" type="submit">Create My Quiz ✨</button></div><p id="createStatus" style="margin-top:14px;font-weight:700"></p></form></section></main>

<script src="data/question-bank.js"></script><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/images.js"></script><script src="js/site.js"></script>
<script>
const relationships=['Girlfriend','Boyfriend','Best Friend','Friend','Brother','Sister','Cousin','Cousin Brother','Cousin Sister','Nephew','Niece','Classmate','School Friend','College Friend','Online Friend','Online Best Friend','Gaming Friend','Childhood Friend','Neighbor','Teammate','Colleague','Roommate','Fiancé/Fiancée','Brother-in-law','Sister-in-law'];
const builder=document.getElementById('questionBuilder'),gender=document.getElementById('creatorGender'),form=document.getElementById('createQuizForm'),status=document.getElementById('createStatus');let selectedQuestions=[];
function renderQuestions(){const bank=window.QUESTION_BANK[gender.value]||[];builder.innerHTML='';if(!gender.value){builder.innerHTML='<div class="cute-card question-card"><h3>Pick Male or Female first 🌈</h3><p>Your matching question bank will appear here.</p></div>';return;}if(!selectedQuestions.length)selectedQuestions=bank.slice(0,10).map((_,i)=>i);selectedQuestions.forEach((idx,pos)=>{const q=bank[idx],card=document.createElement('article');card.className='scrapbook-card builder-question';card.innerHTML='<span class="scrapbook-tape left"></span><span class="scrapbook-tape right"></span><h3>Question '+(pos+1)+'</h3><p><strong>'+escapeHtml(q.question)+'</strong></p><p style="color:#756b88">Choose the correct answer from the full answer collection:</p><div class="question-option-grid">'+q.options.map((o,i)=>'<label class="photo-option"><input type="radio" name="answer-'+pos+'" value="'+i+'" required hidden><img src="'+photoFor(o)+'" alt="'+escapeHtml(o)+'" onerror="imageFallback(this,this.alt)"><span>'+escapeHtml(o)+'</span></label>').join('')+'</div>';card.querySelectorAll('.photo-option').forEach(l=>l.onclick=()=>{card.querySelectorAll('.photo-option').forEach(x=>x.classList.remove('selected'));l.classList.add('selected')});builder.appendChild(card)})}
document.querySelectorAll('.gender-card').forEach(card=>card.addEventListener('click',()=>{gender.value=card.dataset.gender;document.querySelectorAll('.gender-card').forEach(x=>{const active=x===card;x.classList.toggle('selected',active);x.setAttribute('aria-checked',String(active));});selectedQuestions=[];renderQuestions();}));document.getElementById('addQuestionButton').onclick=()=>{const bank=window.QUESTION_BANK[gender.value]||[];if(!gender.value)return alert('Select your gender first.');if(selectedQuestions.length>=15)return alert('Maximum 15 questions.');const next=bank.findIndex((_,i)=>!selectedQuestions.includes(i));if(next>=0){selectedQuestions.push(next);renderQuestions()}};
form.onsubmit=async e=>{e.preventDefault();status.textContent='Creating your quiz…';status.style.color='#7045cf';try{const bank=window.QUESTION_BANK[gender.value];const questions=selectedQuestions.map((idx,pos)=>{const a=document.querySelector('input[name="answer-'+pos+'"]:checked');if(!a)throw new Error('Please select a correct answer for Question '+(pos+1));return {question:bank[idx].question,options:bank[idx].options,correctAnswer:bank[idx].options[Number(a.value)]}});const token=ensureCreatorToken();localStorage.setItem('creatorName',document.getElementById('creatorName').value.trim());localStorage.setItem('creatorGender',gender.value);const data=await api('/quizzes',{method:'POST',body:JSON.stringify({creator_token:token,creator_name:document.getElementById('creatorName').value.trim(),gender:gender.value,title:document.getElementById('creatorName').value.trim()+"'s Friendship Quiz",questions})});localStorage.setItem('lastQuizId',data.quiz_code);location.href='quiz-created.html?quiz='+encodeURIComponent(data.quiz_code)}catch(err){status.textContent=err.message;status.style.color='#d43b65'}};
renderQuestions();
</script></body></html>
