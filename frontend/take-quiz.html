<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><base href="/"><title>Take Quiz · Find Your Real Friend</title><link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span class="brand-name">Find Your Real Friend</span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="create-quiz.html">Create Quiz</a><button class="mobile-menu-button" id="mobileMenuButton" type="button"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header>
<main class="form-page"><section class="cute-card form-card entrance-card"><h2 id="quizTitle">Loading quiz…</h2><div class="form-grid"><div class="field"><label for="friendName">Your Name</label><input id="friendName" maxlength="80" required placeholder="Enter your name"></div><div class="field"><label for="relationship">Your Relationship</label><select id="relationship" required><option value="">Choose relationship</option><option>Girlfriend</option><option>Boyfriend</option><option>Best Friend</option><option>Friend</option><option>Brother</option><option>Sister</option><option>Cousin</option><option>Cousin Brother</option><option>Cousin Sister</option><option>Nephew</option><option>Niece</option><option>Classmate</option><option>School Friend</option><option>College Friend</option><option>Online Friend</option><option>Online Best Friend</option><option>Gaming Friend</option><option>Childhood Friend</option><option>Neighbor</option><option>Teammate</option><option>Colleague</option><option>Roommate</option><option>Fiancé/Fiancée</option><option>Brother-in-law</option><option>Sister-in-law</option></select></div></div></section><div id="progressTrack" style="height:10px;border-radius:20px;background:#eadff3;margin:20px 0;overflow:hidden"><div id="progress" style="height:100%;width:0;background:linear-gradient(90deg,#ef4d88,#7457e8);transition:.3s"></div></div><section id="quizArea"></section><div style="text-align:center"><button class="button purple" id="nextButton">Next Question →</button></div><p id="status" style="text-align:center;font-weight:800"></p></main>

<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/images.js"></script><script src="js/site.js"></script><script>
let quiz,idx=0,answers=[],attemptStarted=false,attemptId=null;const queryId=new URLSearchParams(location.search).get('quiz');const pathMatch=location.pathname.match(/\/q\/([A-Z0-9]+)\/?$/i);const id=queryId|| (pathMatch?pathMatch[1].toUpperCase():'');const area=document.getElementById('quizArea');
function threeOptions(q){return Array.isArray(q.options)?q.options.slice(0,3):[]}
(async()=>{try{if(!id)throw Error('Quiz link is missing.');quiz=await api('/quizzes/'+encodeURIComponent(id));document.getElementById('quizTitle').textContent=quiz.title;render()}catch(e){document.getElementById('status').textContent=e.message;document.getElementById('nextButton').disabled=true}})();
async function startAttempt(){if(attemptStarted)return;const name=document.getElementById('friendName').value.trim(),rel=document.getElementById('relationship').value;if(!name||!rel)return;try{const r=await api('/quizzes/'+encodeURIComponent(id)+'/attempts',{method:'POST',body:JSON.stringify({friend_name:name,relationship:rel,answers:[]})});attemptId=r.attempt_id;attemptStarted=true}catch(e){}}
function render(){const q=quiz.questions[idx],opts=threeOptions(q);area.innerHTML='<article class="scrapbook-card question-card question-enter"><span class="scrapbook-tape left"></span><span class="scrapbook-tape right"></span><h3>Question '+(idx+1)+' of '+quiz.questions.length+'</h3><p>'+escapeHtml(q.question)+'</p><div class="question-option-grid">'+opts.map(o=>'<button type="button" class="photo-option quiz-photo-option" data-value="'+escapeHtml(o)+'"><img src="'+photoFor(o)+'" alt="'+escapeHtml(o)+'" onerror="imageFallback(this,this.alt)"><span>'+escapeHtml(o)+'</span></button>').join('')+'</div></article>';document.getElementById('progress').style.width=((idx)/quiz.questions.length*100)+'%';area.querySelectorAll('.photo-option').forEach(b=>b.onclick=()=>{area.querySelectorAll('.photo-option').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');answers[idx]=b.dataset.value})}
document.getElementById('friendName').addEventListener('blur',startAttempt);document.getElementById('relationship').addEventListener('change',startAttempt);document.getElementById('nextButton').onclick=async()=>{await startAttempt();if(!answers[idx])return document.getElementById('status').textContent='Choose one answer first 💜';if(idx<quiz.questions.length-1){idx++;document.getElementById('status').textContent='';render();return}const name=document.getElementById('friendName').value.trim(),rel=document.getElementById('relationship').value;if(!name||!rel)return document.getElementById('status').textContent='Enter your name and relationship first.';document.getElementById('status').textContent='Saving your result…';try{const r=await api('/quizzes/'+encodeURIComponent(id)+'/submissions',{method:'POST',body:JSON.stringify({friend_name:name,relationship:rel,answers})});location.href='result.html?id='+r.submission_id}catch(e){document.getElementById('status').textContent=e.message}};
</script></body></html>
