<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><base href="/"><title>Result · Find Your Real Friend</title><link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/games.css"></head><body><header class="site-header"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span class="brand-name">Find Your Real Friend</span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="scoreboard.html">My Dashboard</a><button class="mobile-menu-button" id="mobileMenuButton" type="button"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header><main class="form-page"><section class="cute-card form-card" style="text-align:center"><h1 id="score">Loading…</h1><h2 id="classification"></h2><p id="details"></p><a class="button purple" href="scoreboard.html" style="display:inline-block;text-decoration:none">View My Dashboard</a><div id="gamesUnlock" class="secret-games-result" style="margin-top:20px"></div></section><section class="cute-card form-card" id="answerReview"></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');try{const s=await api('/submissions/'+id);document.getElementById('score').textContent=s.score+' / '+s.total;document.getElementById('classification').textContent=s.result;document.getElementById('details').textContent=s.friend_name+' · '+s.relationship;localStorage.setItem('lastFriendScore',String(s.score));localStorage.setItem('lastFriendTotal',String(s.total));const unlock=document.getElementById('gamesUnlock');if(s.score>5){unlock.innerHTML='<div class="secret-games-card"><span class="secret-games-label">🎁 SECRET SURPRISE UNLOCKED</span><h3>Play Corner is yours!</h3><p>You scored more than 5, so your private mini-game collection is unlocked.</p><a class="button pink" href="games.html" style="display:inline-block;text-decoration:none">Open My Play Corner 🎮</a></div>'}else{unlock.innerHTML='<p style="margin:12px 0 0;color:#786b80;font-weight:800">Score above 5 to unlock the offline Play Corner.</p>'}document.getElementById('answerReview').innerHTML='<h2>Answer Details</h2>'+s.details.map((d,i)=>'<article class="question-card"><strong>Question '+(i+1)+': '+escapeHtml(d.question)+'</strong><p style="margin-top:8px">Your answer: '+escapeHtml(d.selected)+' '+(d.is_correct?'✅':'❌')+'</p><p>Correct answer: '+escapeHtml(d.correct)+' </p></article>').join('')}catch(e){document.getElementById('score').textContent=e.message}})();
</script></body></html>
