<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Dashboard · Find Your Real Friend</title><link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span class="brand-name">Find Your Real Friend</span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="create-quiz.html">Create Quiz</a><button class="mobile-menu-button" id="mobileMenuButton" type="button"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header><main class="form-page"><div class="section-title"><h2>My Quiz Dashboard 📊</h2><p id="ownerText">Loading your saved quizzes…</p></div><div id="dashboard"></div></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script>
const box=document.getElementById('dashboard');async function load(){const token=getCreatorToken();if(!token){box.innerHTML='<section class="cute-card form-card"><h3>No creator dashboard on this device yet.</h3><p>Create a quiz first. Your creator token will be stored on this browser so you can return here later on the same device.</p><a class="button pink" href="create-quiz.html">Create My Quiz</a></section>';return}try{const d=await api('/dashboard?token='+encodeURIComponent(token));document.getElementById('ownerText').textContent='Welcome, '+d.creator.name+' · Your quizzes and submissions are stored in the database.';if(!d.quizzes.length){box.innerHTML='<section class="cute-card form-card"><h3>No quizzes yet.</h3><a class="button pink" href="create-quiz.html">Create Your First Quiz</a></section>';return}box.innerHTML=d.quizzes.map(q=>'<section class="cute-card form-card dashboard-quiz"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><div><h3>'+escapeHtml(q.title)+'</h3><p>Quiz code: <strong>'+escapeHtml(q.quiz_code)+'</strong> · '+q.submissions.length+' submission(s)</p></div><a class="button purple" href="take-quiz.html?quiz='+encodeURIComponent(q.quiz_code)+'">Open Quiz</a></div><div class="dashboard-table-wrap"><table class="score-table"><thead><tr><th>Name</th><th>Relationship</th><th>Status</th><th>Score</th><th>Result</th><th>Actions</th></tr></thead><tbody>'+((q.attempts&&q.attempts.length)?q.attempts.map(a=>{const s=q.submissions.find(x=>x.friend_name===a.friend_name&&x.relationship===a.relationship);return '<tr><td>'+escapeHtml(a.friend_name)+'</td><td>'+escapeHtml(a.relationship)+'</td><td>'+escapeHtml(a.status)+'</td><td>'+(s?s.score+'/'+s.total:'—')+'</td><td>'+(s?escapeHtml(s.result):'Not submitted yet')+'</td><td>'+(s?'<a class="button blue small-button" href="view-result.html?id='+s.id+'">View</a> <button class="button red small-button remove-result" data-id="'+s.id+'">Remove</button>':'<span style="color:#9a6f1d;font-weight:800">Waiting</span>')+'</td></tr>'}).join(''):'<tr><td colspan="6">No one has started this quiz yet.</td></tr>')+'</tbody></table></div></section>').join('');document.querySelectorAll('.remove-result').forEach(btn=>btn.onclick=async()=>{if(!confirm('Remove this result permanently?'))return;try{await api('/submissions/'+btn.dataset.id+'?token='+encodeURIComponent(token),{method:'DELETE'});load()}catch(e){alert(e.message)}})}catch(e){box.innerHTML='<section class="cute-card form-card"><h3>Dashboard unavailable</h3><p>'+escapeHtml(e.message)+'</p><p>Make sure the FastAPI backend is running.</p></section>')}}load();
</script></body></html>
