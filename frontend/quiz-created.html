<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz Created · Find Your Real Friend</title><link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-header"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span class="brand-name">Find Your Real Friend</span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="scoreboard.html">My Dashboard</a><button class="mobile-menu-button" id="mobileMenuButton" type="button"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header>
<main class="form-page"><section class="cute-card form-card" style="text-align:center"><h1>🎉 Your Quiz Is Ready!</h1><p id="quizInfo">Loading…</p><div class="cute-card" style="padding:20px;margin:20px 0;background:#fff"><input id="shareLink" style="width:100%;box-sizing:border-box;padding:14px;border:2px solid #eadff3;border-radius:14px;font:inherit" readonly></div><button class="button pink" id="copyButton">Copy Quiz Link</button> <a class="button purple" href="scoreboard.html" style="display:inline-block;text-decoration:none">Open Dashboard</a></section></main>

<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('quiz')||localStorage.getItem('lastQuizId');if(!id){location.href='create-quiz.html';return}try{const q=await api('/quizzes/'+encodeURIComponent(id));document.getElementById('quizInfo').textContent=q.title+' · '+q.questions.length+' questions';const link=location.origin+'/q/'+encodeURIComponent(id);document.getElementById('shareLink').value=link;document.getElementById('copyButton').onclick=async()=>{await navigator.clipboard.writeText(link);document.getElementById('copyButton').textContent='Copied ✓'}}catch(e){document.getElementById('quizInfo').textContent=e.message}})();
</script></body></html>
