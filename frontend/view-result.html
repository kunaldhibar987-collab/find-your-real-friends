<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>View Friend Result · Find Your Real Friend</title><link rel="stylesheet" href="assets/ui-kit/typography/fonts.css"><link rel="stylesheet" href="assets/ui-kit/background/background.css"><link rel="stylesheet" href="assets/ui-kit/navbar/navbar.css"><link rel="stylesheet" href="assets/ui-kit/cards/cards.css"><link rel="stylesheet" href="assets/ui-kit/buttons/buttons.css"><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="navbar-shell"><a class="brand" href="index.html"><span class="brand-mark">♥</span><span class="brand-name">Find Your Real Friend</span></a><nav class="desktop-navigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav><a class="header-create-button" href="scoreboard.html">My Dashboard</a><button class="mobile-menu-button" id="mobileMenuButton" type="button"><span></span><span></span><span></span></button></div><nav class="mobile-navigation" id="mobileNavigation"><a class="nav-link" href="index.html">Home</a><a class="nav-link" href="create-quiz.html">Create Quiz</a><a class="nav-link" href="scoreboard.html">My Dashboard</a></nav></header><main class="form-page"><section class="cute-card form-card"><h2 id="heading">Loading result…</h2><p id="meta"></p><div id="details"></div></section></main><script src="js/config.js"></script><script src="js/api.js"></script><script src="js/site.js"></script><script>
(async()=>{try{const s=await api('/submissions/'+new URLSearchParams(location.search).get('id'));document.getElementById('heading').textContent=s.friend_name+' scored '+s.score+'/'+s.total+' · '+s.result;document.getElementById('meta').textContent=s.relationship+' · '+new Date(s.submitted_at).toLocaleString();document.getElementById('details').innerHTML='<h3>Question-by-question result</h3>'+s.details.map((d,i)=>'<article class="question-card"><strong>Q'+(i+1)+'. '+escapeHtml(d.question)+'</strong><p>Your answer: '+escapeHtml(d.selected)+' '+(d.is_correct?'✅ Correct':'❌ Wrong')+'</p><p>Correct answer: '+escapeHtml(d.correct)+'</p></article>').join('')}catch(e){document.getElementById('heading').textContent=e.message}})();
</script></body></html>
